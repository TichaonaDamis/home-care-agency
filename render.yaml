# Render Blueprint. A persistent disk requires a paid instance type; free instances lose data on restart.
services:
  - type: web
    name: carehours
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATABASE_FILE
        value: /var/data/carehours.sqlite
    disk:
      name: carehours-data
      mountPath: /var/data
      sizeGB: 1
